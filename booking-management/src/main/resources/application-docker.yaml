server:
  port:
    9005

spring:
  application:
    name: booking-management
  banner:
    location: classpath:banner.txt
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    # Using the AWS RDS endpoint for MySQL
    url: jdbc:mysql://booking.cp6qemaye14q.ap-south-1.rds.amazonaws.com:3306/booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: admin
    password: maheshchabbi
  jpa:
    hibernate:
      ddl-auto: update   # For testing; consider using migrations in production.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  data:
    cassandra:
      port: 9042
      contact-points: hb-cassandra
      local-datacenter: datacenter1
      keyspace-name: mykeyspace
      schema-action: CREATE_IF_NOT_EXISTS
      entity-base-package: com.dlim2012.archival.entity.cassandra

  zipkin:
    base-url: http://hb-zipkin:9411

  cache:
    type: redis
    cache-names:
      - hotel-booking
      - user-booking
      - booking
      - booking-room
      - hotel
    redis:
      time-to-live: 10000
      cache-null-values: true

eureka:
  instance:
    hostname: hb-eureka-server
    port: 9200
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${eureka.instance.port}/eureka/

custom:
  security:
    rsa:
      public-key: classpath:certs/public.pem
    roles:
      - ADMIN
      - HOTEL_MANAGER
      - APP_USER
  redis:
    host: hotel1.uyazel.ng.0001.aps1.cache.amazonaws.com  # Updated AWS ElastiCache endpoint
    port: 6379
    time-to-live: 10000  # Cache expiry in milliseconds
    cache-null-values: true
  gateway: "http://hb-apigw:9000"
